name: iOS App Store upload

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pachimon-app-store-upload
  cancel-in-progress: false

jobs:
  configuration:
    name: Check Apple signing configuration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.apple.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check presence without disclosing secret values
        id: apple
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.kasaisolutions.pachimon' }}
          IOS_MARKETING_VERSION: ${{ vars.IOS_MARKETING_VERSION || '1.0.0' }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ios-app-store-upload.sh --check-config
  validation:
    name: Validate this revision before distribution
    uses: ./.github/workflows/ios-validation.yml
    permissions:
      contents: read
  upload:
    name: Sign and send to App Store Connect
    needs:
      - configuration
      - validation
    if: github.ref == 'refs/heads/main' && needs.configuration.outputs.ready == 'true' && needs.validation.result == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_XCODE_VERSION: ${{ vars.IOS_XCODE_VERSION || '26.2' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.kasaisolutions.pachimon' }}
      IOS_MARKETING_VERSION: ${{ vars.IOS_MARKETING_VERSION || '1.0.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Xcode and prepare the bundled game
        run: |
          bash scripts/ios-select-xcode.sh
          node scripts/prepare-ios.mjs
      - name: Import temporary signing identity, archive, validate and upload
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash scripts/ios-app-store-upload.sh
      - name: Keep the signed application
        if: success()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: pachimon-signed-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pachimon-ios-distribution/export/*.ipa
          if-no-files-found: error
          retention-days: 7
  non-main:
    name: Explain the main-branch requirement
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '## 未送信' >> "$GITHUB_STEP_SUMMARY"
          echo 'App Storeへの署名・アップロードはmainブランチだけで実行します。検証結果を確認してmainへ反映後、mainを指定して再実行してください。' >> "$GITHUB_STEP_SUMMARY"
          exit 1
